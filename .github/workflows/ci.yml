name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: py_compile all modules
        run: |
          find shared finance_bot/bot knowledge_bot planning_bot -name '*.py' \
            ! -path '*/__pycache__/*' -print0 \
            | xargs -0 python -m py_compile

      - name: Smoke imports (all bots)
        env:
          TELEGRAM_BOT_TOKEN: ci-smoke-test-token
          TELEGRAM_FINANCE_BOT_TOKEN: ci-smoke-test-token
          TELEGRAM_UNIFIED_BOT_TOKEN: ci-smoke-test-token
          DEEPSEEK_API_KEY: ci-smoke-test-key
        run: SMOKE_INSTALL=1 ./scripts/smoke_imports.sh

      - name: Integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/finance_bot:${{ github.workspace }}/knowledge_bot:${{ github.workspace }}/planning_bot
          TELEGRAM_BOT_TOKEN: ci-smoke-test-token
          TELEGRAM_FINANCE_BOT_TOKEN: ci-smoke-test-token
          TELEGRAM_UNIFIED_BOT_TOKEN: ci-smoke-test-token
          DEEPSEEK_API_KEY: ci-smoke-test-key
          DEPLOY_MODE: single
        run: |
          cp finance_bot/config/nlu_config.yaml.example finance_bot/config/nlu_config.yaml
          cp knowledge_bot/config/media_extensions.yaml.example knowledge_bot/config/media_extensions.yaml
          finance_bot/.venv/bin/pip install -q pytest pytest-asyncio
          knowledge_bot/.venv/bin/pip install -q pytest
          cp knowledge_bot/config/tag_domains.yaml.example knowledge_bot/config/tag_domains.yaml
          cp planning_bot/config/kanban_schema.yaml.example planning_bot/config/kanban_schema.yaml
          cp finance_bot/config/analytics_categories.yaml.example finance_bot/config/analytics_categories.yaml
          finance_bot/.venv/bin/python -m pytest \
            tests/test_transaction_parse.py tests/test_llm_json.py tests/test_kanban_sort.py \
            tests/test_finance_llm.py tests/test_transactions_core.py tests/test_agent_platform.py \
            tests/test_calendar_sync.py tests/test_tag_normalize.py tests/test_entity_names.py -q
          knowledge_bot/.venv/bin/python -m pytest tests/test_note_complete.py -q
