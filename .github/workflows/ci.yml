name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        locale: [en]
        include:
          # Locale parity job (one Python version is enough)
          - python-version: "3.12"
            locale: ru

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: py_compile all modules
        run: |
          find shared finance_bot/bot knowledge_bot planning_bot unified_bot -name '*.py' \
            ! -path '*/__pycache__/*' -print0 \
            | xargs -0 python -m py_compile

      - name: Smoke imports (all bots)
        env:
          TELEGRAM_BOT_TOKEN: ci-smoke-test-token
          TELEGRAM_FINANCE_BOT_TOKEN: ci-smoke-test-token
          TELEGRAM_UNIFIED_BOT_TOKEN: ci-smoke-test-token
          DEEPSEEK_API_KEY: ci-smoke-test-key
        run: SMOKE_INSTALL=1 ./scripts/smoke_imports.sh

      - name: Ensure bot venvs
        run: bash scripts/ensure_bot_venv.sh finance_bot knowledge_bot

      - name: Integration tests (full suite)
        env:
          TELEGRAM_BOT_TOKEN: ci-smoke-test-token
          TELEGRAM_FINANCE_BOT_TOKEN: ci-smoke-test-token
          TELEGRAM_UNIFIED_BOT_TOKEN: ci-smoke-test-token
          DEEPSEEK_API_KEY: ci-smoke-test-key
          DEPLOY_MODE: single
          AGENT_LOCALE: ${{ matrix.locale }}
          VAULT_PATH: ${{ runner.temp }}/ci-vault
        run: |
          mkdir -p "$VAULT_PATH"
          bash scripts/run_tests.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          python -m pip install -q ruff
          ruff check shared unified_bot --select E9,F63,F7,F82 --ignore E501
      - name: Shellcheck (OSS entrypoints — must pass)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -e SC1090,SC1091 \
            scripts/setup.sh \
            scripts/run_tests.sh \
            scripts/onboarding_wizard.sh \
            scripts/setup_agent_config.sh
          # Sync step libs (sourced; still lintable)
          shellcheck -e SC1090,SC1091,SC2034,SC2154,SC2086,SC2155 \
            scripts/lib/sync_steps_rsync.sh \
            scripts/lib/sync_steps_charts.sh \
            scripts/lib/sync_steps_maintenance.sh

  capabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capability presets + onboarding smoke
        env:
          TELEGRAM_BOT_TOKEN: ci-smoke-test-token
          TELEGRAM_FINANCE_BOT_TOKEN: ci-smoke-test-token
          TELEGRAM_UNIFIED_BOT_TOKEN: ci-smoke-test-token
          DEEPSEEK_API_KEY: ci-smoke-test-key
          DEPLOY_MODE: single
          AGENT_LOCALE: en
        run: |
          bash scripts/ensure_bot_venv.sh finance_bot --recreate
          FIN_PY="$PWD/finance_bot/.venv/bin/python"
          [ -x "$FIN_PY" ] || { echo "missing finance_bot venv: $FIN_PY" >&2; exit 1; }
          export PYTHONPATH="$PWD:$PWD/finance_bot:$PWD/knowledge_bot:$PWD/planning_bot"
          export VAULT_PATH="${RUNNER_TEMP}/ci-vault"
          mkdir -p "$VAULT_PATH"
          "$FIN_PY" -m pip install -q pytest pytest-asyncio
          "$FIN_PY" scripts/onboarding_smoke.py --golden-planning --golden-finance --golden-knowledge --agent-sanity
          "$FIN_PY" -m eval.harness
          "$FIN_PY" -m pytest tests/test_capabilities.py tests/test_profile_matrix.py \
            tests/test_ui_bindings.py tests/test_ui_patterns.py tests/test_agent_sanity.py \
            tests/test_prompt_preamble.py tests/test_onboarding.py tests/test_no_cyrillic_in_py.py \
            tests/test_messages_locale_parity.py tests/test_domain_messages_locale_parity.py \
            tests/test_prompt_git_policy.py tests/test_prompt_scaffolds.py \
            tests/test_cheap_router.py tests/test_fsm_sqlite.py tests/test_finance_category_match.py \
            tests/test_host_import_boundary.py tests/test_bootstrap_checklist.py \
            tests/test_config_policy.py tests/test_no_temperature_literals.py -q
