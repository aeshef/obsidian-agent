# Keep CI actions and Python deps on a predictable cadence.
# Enable "Dependabot security updates" in repo Settings → Code security after merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /finance_bot
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /planning_bot
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /knowledge_bot
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
