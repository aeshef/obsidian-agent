<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3fb950"/>
    </marker>
  </defs>
  <title id="title">obsidian-agent architecture</title>
  <desc id="desc">Telegram talks to a unified bot. Three domains write an Obsidian vault. Optional Mac sync draws charts. Optional VPS keeps the bot online.</desc>
  <rect width="1200" height="620" fill="#0d1117"/>

  <text x="40" y="42" fill="#e6edf3" font-size="22" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="700">obsidian-agent</text>
  <text x="40" y="66" fill="#8b949e" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Telegram is the sensor. The vault is canonical. Sync is optional and fail-closed.</text>

  <!-- clients -->
  <rect x="40" y="96" width="220" height="72" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="150" y="128" text-anchor="middle" fill="#e6edf3" font-size="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="700">Telegram</text>
  <text x="150" y="148" text-anchor="middle" fill="#8b949e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">text · voice · photo · files</text>

  <rect x="940" y="96" width="220" height="72" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
  <text x="1050" y="128" text-anchor="middle" fill="#e6edf3" font-size="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="700">Obsidian</text>
  <text x="1050" y="148" text-anchor="middle" fill="#8b949e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">edit the vault on disk</text>

  <!-- host -->
  <rect x="320" y="96" width="560" height="72" rx="12" fill="#161b22" stroke="#bc8cff" stroke-width="1.6"/>
  <text x="600" y="128" text-anchor="middle" fill="#e6edf3" font-size="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="700">unified_bot</text>
  <text x="600" y="148" text-anchor="middle" fill="#8b949e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">host · cheap router · tool loop · confirm-before-write</text>

  <!-- arrows clients -->
  <path d="M260 132 H320" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M880 132 H940" fill="none" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrg)"/>

  <!-- domains -->
  <rect x="40" y="212" width="360" height="132" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
  <text x="60" y="242" fill="#3fb950" font-size="15" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="700">planning</text>
  <text x="60" y="268" fill="#c9d1d9" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">kanban · goals · routines</text>
  <text x="60" y="290" fill="#c9d1d9" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">reflection · calendar overlay</text>
  <text x="60" y="318" fill="#8b949e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">markdown board in the vault</text>

  <rect x="420" y="212" width="360" height="132" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="440" y="242" fill="#58a6ff" font-size="15" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="700">knowledge</text>
  <text x="440" y="268" fill="#c9d1d9" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">ingest · tags · wikilinks</text>
  <text x="440" y="290" fill="#c9d1d9" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">RAG · optional serendipity</text>
  <text x="440" y="318" fill="#8b949e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">notes you already own</text>

  <rect x="800" y="212" width="360" height="132" rx="12" fill="#161b22" stroke="#d29922" stroke-width="1.6"/>
  <text x="820" y="242" fill="#d29922" font-size="15" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="700">finance</text>
  <text x="820" y="268" fill="#c9d1d9" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">NLU ledger · dashboards</text>
  <text x="820" y="290" fill="#c9d1d9" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">optional broker / cards / benefits</text>
  <text x="820" y="318" fill="#8b949e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">SQLite + markdown charts</text>

  <path d="M420 168 V212" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M600 168 V212" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M780 168 V212" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- shared -->
  <rect x="40" y="372" width="1120" height="70" rx="12" fill="#1a1430" stroke="#bc8cff" stroke-width="1.6"/>
  <text x="60" y="400" fill="#d2b8ff" font-size="15" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="700">shared/</text>
  <text x="60" y="422" fill="#c9d1d9" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">agent platform · capabilities (fail-closed) · LLM · ASR · Telegram host · locale YAML</text>

  <path d="M220 344 V372" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M600 344 V372" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M980 344 V372" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ops row -->
  <rect x="40" y="470" width="540" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="60" y="496" fill="#e6edf3" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="700">VPS (optional)</text>
  <text x="60" y="516" fill="#8b949e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">24/7 bot · schedulers · no vault GUI required</text>

  <rect x="620" y="470" width="540" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="640" y="496" fill="#e6edf3" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="700">Mac sync (optional)</text>
  <text x="640" y="516" fill="#8b949e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">rsync enabled folders only · matplotlib charts · maintenance</text>

  <!-- vault -->
  <rect x="40" y="554" width="1120" height="46" rx="12" fill="#10261a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="60" y="582" fill="#7ee2a8" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="700">Obsidian vault</text>
  <text x="220" y="582" fill="#c9d1d9" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">tasks · goals · dashboards · knowledge · finance.db  —  paths from config, not hardcoded</text>

  <path d="M310 534 V554" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M890 534 V554" fill="none" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrg)"/>
</svg>
