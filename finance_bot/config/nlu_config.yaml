# Конфигурация для NLU парсера транзакций

# Ключевые слова для распознавания финансовых транзакций
transaction_keywords:
  - потратил
  - зарплата
  - перевел
  - долг
  - вернул
  - купил
  - оплатил
  - получил
  - доход
  - расход
  - подписка
  - заплатил
  - отдал
  - взял
  - пополнил
  - вывел
  - брокер
  - снял
  - снятие
  - комиссия
  - иис
  - инвест
  - должен
  - должна
  - погасил
  - долгу

# Категории для брокерского счета
broker_categories:
  topup: "Пополнение брокера"
  withdraw: "Вывод с брокера"
  fee: "Комиссия брокера"

# Минимальная длина текста для обработки
min_text_length: 3

# Точные команды, которые не должны обрабатываться NLU
exact_commands:
  - "Синк Тинькофф"

# Кнопки главного меню (не NLU)
menu_buttons:
  - "➖ Добавить расход"
  - "➕ Добавить доход"
  - "↔️ Перевод"
  - "💼 Долги"
  - "📈 Инвестиции"
  - "📊 Баланс"
  - "🧾 Последние операции"
  - "📊 Суммаризация"
  - "🔄 Синхронизация"

# Ключевые слова для добавления счетов с балансами
account_keywords:
  - баланс
  - счет
  - карта
  - кошелек
  - на
  - у меня
  - есть

# Шаблон для контекста пользователя
user_context_template: |
  [REDACTED]

  Типичные операции:
  - Переводы между счетами (например: 'перевел 10000 с альфы на сбер')
  - Пополнение брокерского счета (например: 'пополнил брокер на 50000 с тбк')
  - Вывод с брокерского счета текстом (например: 'снял 10к с брокера на тбанк вчера комиссия 9р'; то же через кнопки в боте)
  - Обычные траты и доходы (например: 'потратил 500 на кофе', 'зарплата 150000 пришла на тбк')
  - Долги (например: 'мне должны 5000 от игоря', 'вернул долг 2000 маше')
  - Добавление/обновление баланса счета (например: 'у меня на сбербанке 50000', 'баланс тбк 30000')
