# Run the unified bot in a container **after** bootstrap
# (see config/agent/bootstrap_checklist.yaml.example).
# Docker is runtime only — it does not replace /setup or onboarding_wizard.sh.
#   1) Complete bootstrap checklist (capabilities, vault_paths, secrets)
#   2) cp .env.example .env if needed; fill TELEGRAM_UNIFIED_BOT_TOKEN + DEEPSEEK_API_KEY
#   3) export HOST_VAULT_PATH="/absolute/path/to/your-vault"
#   4) docker compose up --build
services:
  unified-bot:
    build: .
    image: obsidian-agent:latest
    container_name: obsidian-agent
    restart: unless-stopped
    env_file: .env
    environment:
      # In-container vault path; override VAULT_PATH from .env so the mount wins.
      VAULT_PATH: /vault
      DEPLOY_MODE: single
    volumes:
      - ${HOST_VAULT_PATH:-./vault}:/vault
    # Bots use long-polling (no inbound ports needed).
