# Ежедневное обслуживание 700_ (запуск: tools/vault_daily_maintenance.py из obsidian_sync, маркер в .sync)
# Без жёсткого кода: лимиты и флаги здесь.

daily:
  enabled: true
  marker_basename: daily_vault_write_maintenance_date.txt

# Хабы: wikilinks-страницы по hubs_registry.yaml (лёгко, без API)
sync_hubs:
  enabled: true
  write: true

# Пакетные [[wikilinks]] в телах заметок (нужен DEEPSEEK_API_KEY)
apply_wikilinks:
  enabled: true
  apply: true
  limit: 30

# Убрать узкие topic/* (фильмы, фестивали, ielts-writing…) и прочий шум-синглтон.
# Идёт ДО retag_notes: сначала чистка, потом добавление устоявшихся domain/topic.
refill_singleton_tags:
  enabled: true
  apply: true
  limit: 30
  topic_max_count: 2   # topic/* с count≤2 — кандидат на удаление; прочие неймспейсы — только count=1

# Перетегирование заметок с редкими тегами (count≤threshold), дёшево
# Сортировка: сначала заметки с наибольшим числом плохих тегов
retag_notes:
  enabled: true
  apply: true
  limit: 35          # пачка в сутки; для единоразового прогона: tools/retag_notes.py --all --apply
  threshold: 1       # только синглтоны (count=1); ставь 2 для более агрессивной чистки
  # Если LLM добавил устоявшийся topic/* — убрать старые topic/* с count≤threshold (шум в графе)
  strip_obsolete_singleton_topics: true

# Заметки без тегов (сбой tags generation или пустой tags: []) — отдельный шаг
retag_untagged:
  enabled: true
  apply: true
  limit: 40          # пачка в сутки; единоразово: tools/retag_notes.py --no-tags --all --apply

# Переобработка «плохих» имён (ASR/Vision, дорого): поставь 0 — отключить шаг, или 8+ если готов(а) к длинным sync
# Заметки с title="Без_названия"/"Субтитры"/"IMG*" обрабатываются первыми
reprocess_notes:
  enabled: true
  apply: true
  limit: 8

# Полный цикл по сиротским Export:
# 1) аудит и broken refs
# 2) опциональный rehydrate через пайплайн (создать заметки по файлам)
# 3) удаление оставшихся сирот с safety-cap
export_orphans:
  enabled: true
  apply: true
  print_limit: 120
  rehydrate_limit: 12
  rehydrate_max_mb: 25
  cleanup:
    enabled: true
    delete_cap: 500
    fix_broken_refs: true
    fix_broken_body_refs: true

# Дедупликация: content dups (keep_base/keep_fullest) + generic-серии (Без_названия_N) + сиротские Export.
# Сначала dry-run → подсчёт; если count > max_delete_per_run — отмена + Telegram-алерт; иначе apply.
apply_duplicates:
  enabled: true
  max_delete_per_run: 100   # безопасный потолок; при превышении — алерт вместо применения

# Устарело: слепое удаление всех count=1 (убивает и «хорошие» синглтоны). Оставлено выключенным.
singleton_tags_report:
  enabled: false
