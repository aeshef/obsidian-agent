# Утверждённые переносы тегов: "было" -> "стало" (полные строки namespace/slug)
# Сначала: python tools/tag_ontology.py propose
# Проверь data/tag_ontology_proposal.yaml, перенеси сюда, затем: python tools/tag_ontology.py apply --apply

version: 1
# Слияния проверены: из аудита + LLM-propose (data/tag_ontology_proposal.yaml)
mappings:
  # Singular/plural variants → plural canonical
  topic/dream: topic/dreams
  topic/gift: topic/gifts
  topic/startup: topic/startups
  topic/game: topic/gaming
  # Self-improvement cluster → unified
  topic/self-improvement: topic/personal-development
  topic/self-development: topic/personal-development
  topic/self-help: topic/personal-development
  topic/personal-growth: topic/personal-development
  # Specific → broader (only if truly synonymous)
  topic/self-care: topic/wellness
  topic/career-change: topic/career
  topic/social-justice: topic/social-issues
  topic/spirituality: topic/spiritual-journey
  # Domain/topic collisions → unify on domain side
  topic/business: domain/business
  topic/career: domain/career
  topic/health: domain/health
  topic/philosophy: domain/philosophy
  topic/trading: domain/trading
  topic/travel: domain/travel

propose:
  namespaces:
    - topic
    - domain
  max_per_llm_batch: 50
  model: deepseek-chat
